<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="dsh-ikaros-pet — 伊卡洛斯桌宠">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1834"/>
      <stop offset="0.55" stop-color="#1c2f63"/>
      <stop offset="1" stop-color="#3b1e4f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.45" stop-color="#ffe4ef"/>
      <stop offset="1" stop-color="#ffb9d6"/>
    </linearGradient>
    <linearGradient id="cream2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc9e2"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="0.5" stop-color="#d9b8ff"/>
      <stop offset="1" stop-color="#ffb3d9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ecb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- 装饰光晕 -->
  <circle cx="180" cy="60" r="130" fill="url(#glowA)"/>
  <circle cx="1040" cy="230" r="150" fill="url(#glowA)"/>
  <circle cx="620" cy="290" r="120" fill="url(#glowA)" opacity="0.5"/>

  <!-- 光点 -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="90" cy="220" r="2.5"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="520" cy="40" r="1.8"/>
    <circle cx="760" cy="70" r="2.2"/>
    <circle cx="980" cy="50" r="2.6"/>
    <circle cx="1120" cy="150" r="2"/>
    <circle cx="60" cy="120" r="1.8"/>
    <circle cx="880" cy="250" r="2.2"/>
    <circle cx="420" cy="250" r="2"/>
  </g>

  <!-- 主标题：奶油质感 -->
  <text x="600" y="128" text-anchor="middle"
        font-family="'Arial Rounded MT Bold','Segoe UI',Verdana,sans-serif"
        font-size="72" font-weight="bold" letter-spacing="2"
        fill="url(#cream)" stroke="#fff" stroke-width="14" stroke-linejoin="round"
        paint-order="stroke" filter="url(#shadow)">dsh-ikaros-pet</text>

  <!-- 主标题奶油高光 -->
  <text x="600" y="120" text-anchor="middle"
        font-family="'Arial Rounded MT Bold','Segoe UI',Verdana,sans-serif"
        font-size="72" font-weight="bold" letter-spacing="2"
        fill="url(#cream2)" opacity="0.75">dsh-ikaros-pet</text>

  <!-- 分隔光带 -->
  <rect x="300" y="162" width="600" height="3" rx="1.5" fill="url(#sub)" opacity="0.8" filter="url(#soft)"/>

  <!-- 副标题 -->
  <text x="600" y="212" text-anchor="middle"
        font-family="'Microsoft YaHei UI','Microsoft YaHei','Segoe UI',sans-serif"
        font-size="34" font-weight="bold" letter-spacing="4"
        fill="url(#sub)" filter="url(#shadow)">伊卡洛斯桌宠 · 看见你的 DSH · 任务完成时开口</text>

  <!-- 小字 -->
  <text x="600" y="262" text-anchor="middle"
        font-family="'Segoe UI',Verdana,sans-serif"
        font-size="17" letter-spacing="6" fill="#cfe4ff" opacity="0.9"
        filter="url(#shadow)">BASED ON SAKURA DESKTOP PET · VITS VOICE · DEEPSEEK-CHAT</text>
</svg>
